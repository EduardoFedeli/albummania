# A cada push na main: verifica, constrói e publica no Cloudflare Pages (ADR-0006).
# Se qualquer verificação falhar, o site continua na versão anterior.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  verificar-construir-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar os tipos
        run: npm run typecheck

      - name: Rodar os testes
        run: npm test

      - name: Construir o site
        run: npm run build
        env:
          VITE_VERSAO: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CHAVE_PUBLICA: ${{ vars.VITE_SUPABASE_CHAVE_PUBLICA }}
          VITE_CSV_CATALOGO_URL: ${{ vars.VITE_CSV_CATALOGO_URL }}
          VITE_CSV_CONFIG_URL: ${{ vars.VITE_CSV_CONFIG_URL }}

      # A prévia (previa/) usa o protótipo de propósito; a página principal não pode carregar nada dele.
      - name: Conferir que o protótipo não vazou para a página principal
        run: |
          for arquivo in $(grep -oE 'assets/[^"]+\.(js|css)' dist/index.html | sort -u); do
            if grep -qE "seletor-prototipo|vd-espaco|fonts.googleapis" "dist/$arquivo"; then
              echo "::error::Código do protótipo encontrado em $arquivo, carregado pela página principal"
              exit 1
            fi
          done

      # O Admin usa a biblioteca do Supabase (ADR-0005); a Vitrine não pode carregar nada dela.
      - name: Conferir que o Admin não vazou para a Vitrine
        run: |
          for arquivo in $(grep -oE 'assets/[^"]+\.(js|css)' dist/index.html | sort -u); do
            if grep -qE "GoTrueClient|signInWithPassword" "dist/$arquivo"; then
              echo "::error::Código do Admin encontrado em $arquivo, carregado pela Vitrine"
              exit 1
            fi
          done

      # Os segredos não podem ser lidos num "if", então este passo só responde se o token existe.
      # O token fica restrito a este passo e aos de publicar: o build e os testes nunca o veem.
      - name: Conferir se o Cloudflare está configurado
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configurado=sim" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta o segredo CLOUDFLARE_API_TOKEN (docs/operacao.md): o site foi verificado, mas não publicado."
          fi

      # Na primeira vez, cria o projeto. Nas outras, ele já existe e o erro é ignorado.
      - name: Criar o projeto no Cloudflare Pages
        if: steps.cloudflare.outputs.configurado == 'sim'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create albummania --production-branch=main

      - name: Publicar no Cloudflare Pages
        if: steps.cloudflare.outputs.configurado == 'sim'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=albummania --branch=main --commit-hash=${{ github.sha }}
