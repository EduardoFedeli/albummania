<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ÁlbumMania</title>
    <meta name="description" content="Figurinhas, cards e colecionáveis avulsos, com foto, preço e estoque." />
    <meta name="theme-color" content="#14213d" />

    <!-- Prévia do link no WhatsApp (Open Graph). Quem lê é o robô do WhatsApp, que não roda JavaScript:
         por isso o nome da loja fica escrito aqui, e não vem do banco. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="ÁlbumMania" />
    <meta property="og:title" content="ÁlbumMania" />
    <meta property="og:description" content="Figurinhas, cards e colecionáveis avulsos, com foto, preço e estoque. Monte o pedido e finalize pelo WhatsApp." />

    <!-- O tema escuro é o padrão. Quem escolheu o claro (botão de tema, src/ui/tema.ts) recebe ele
         antes da primeira pintura, sem a tela piscar escura. -->
    <script>
      try {
        if (localStorage.getItem('tema') === 'claro') document.documentElement.dataset.tema = 'claro'
      } catch {
        // Sem localStorage (aba anônima, cookies bloqueados): fica o padrão, o escuro.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
